<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>YT Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>YT Downloader</h1>
    <span id="state" class="state"><i id="rec" class="rec" hidden></i><span id="stateText">確認中</span></span>
  </header>

  <section class="target">
    <div id="pageTitle" class="page-title">-</div>
    <div id="pageUrl" class="page-url"></div>
  </section>

  <section class="actions">
    <button id="btnVideo" type="button" data-icon="video">動画</button>
    <button id="btnAudio" type="button" data-icon="audio">音声</button>
  </section>
  <div id="message" class="message" hidden></div>

  <section class="jobs">
    <div class="jobs-head">
      <span>最近のダウンロード</span>
      <button id="btnOpen" class="link" type="button">アプリを開く</button>
    </div>
    <ul id="jobs"><li class="empty">まだありません</li></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
