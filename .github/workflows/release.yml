# v から始まるタグ（例: v1.0.0）を push すると、Windows 上でビルドして Releases に公開する
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するタグ（例: v1.0.0）"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: バージョンを確認
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          $src = Select-String -Path src/ytdl/__init__.py -Pattern 'VERSION = "(.+)"'
          $code = $src.Matches[0].Groups[1].Value
          if ($code -ne $version) { throw "タグ $env:TAG と src/ytdl/__init__.py の VERSION ($code) が一致しません" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: exe をビルド
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          pyinstaller --noconfirm --clean ytdownloader.spec
          Copy-Item -Recurse extension dist/YTDownloader/extension

      - name: zip 版を作る
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/YTDownloader -DestinationPath "release/YTDownloader-$env:VERSION-portable.zip"

      - name: インストーラーを作る
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" installer/ytdownloader.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: SHA-256 を書き出す
        shell: pwsh
        run: |
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Out-File -FilePath release/SHA256SUMS.txt -Encoding ascii

      - name: Releases に公開
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## ダウンロード

          - **YTDownloader-Setup-$env:VERSION.exe**: インストーラー（管理者権限は不要）
          - **YTDownloader-$env:VERSION-portable.zip**: 展開して YTDownloader.exe を起動する持ち運び版

          初回起動時に yt-dlp・FFmpeg・Deno を自動で取得する。
          Chrome 拡張機能の導入手順は README を参照。
          "@
          gh release create $env:TAG (Get-ChildItem release -File).FullName --title "YT Downloader $env:VERSION" --notes $notes
